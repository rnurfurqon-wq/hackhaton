    <path d="M46 232 L54 184 Q60 158 92 149 L148 149 Q180 158 186 184 L194 232 Z" fill="#2D3E66"/>
    <path d="M98 150 L142 150 L134 206 L106 206 Z" fill="#FFFFFF"/>
    <path d="M97 151 L114 206 L98 206 L82 168 Z" fill="#24335A"/>
    <path d="M143 151 L126 206 L142 206 L158 168 Z" fill="#24335A"/>
    <path d="M104 150 L120 163 L109 170 Z" fill="#FFFFFF"/>
    <path d="M136 150 L120 163 L131 170 Z" fill="#FFFFFF"/>
