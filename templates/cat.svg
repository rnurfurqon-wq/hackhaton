    <path class="mouth-closed" d="M112 122 Q116 127.5 120 122.5 Q124 127.5 128 122" fill="none" stroke="#2A2226" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse class="mouth-open" cx="120" cy="127" rx="6.5" ry="6" fill="#7A2E3A" stroke="#2A2226" stroke-width="2"/>
    <g class="mouth-happy" stroke="#2A2226" stroke-width="2.5" stroke-linejoin="round">
      <path d="M105 121 Q120 148 135 121 Q120 127 105 121 Z" fill="#B8434F"/>
      <path d="M112 133 Q120 127 128 133 Q120 142 112 133 Z" fill="#F08A8A" stroke="none"/>
    </g>
    <path class="mouth-flat" d="M114 128 Q120 122.5 126 128" fill="none" stroke="#2A2226" stroke-width="2.5" stroke-linecap="round"/>
    <path class="mouth-frown" d="M112 130 Q120 123 128 130" fill="none" stroke="#2A2226" stroke-width="2.5" stroke-linecap="round"/>
    <path class="mouth-wavy" d="M106 127 q3.5 -4 7 0 t7 0 t7 0 t7 0" fill="none" stroke="#2A2226" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

