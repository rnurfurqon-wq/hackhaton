    <circle cx="191" cy="40" r="5"/>
    <circle cx="206" cy="27" r="7"/>
  </g>
  <g class="fx-question" font-size="34" font-weight="800" font-family="Fredoka, Nunito, Arial, sans-serif" fill="#F2B01E" stroke="#2A2226" stroke-width="2" paint-order="stroke">
    <text x="22" y="46">?</text>
    <text x="184" y="40">?</text>
  </g>
  <g class="fx-waves" fill="none" stroke="#2BA8E8" stroke-width="3" stroke-linecap="round">
    <path d="M48 70 Q40 59 48 48"/>
    <path d="M37 77 Q25 59 37 41"/>
  </g>
