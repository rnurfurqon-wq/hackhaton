      <path d="M172 60 Q165 71 172 77 Q179 71 172 60 Z"/>
      <path d="M194 40 Q185 54 194 62 Q203 54 194 40 Z"/>
    </g>
  </g>

  <!-- Meja -->
  <g class="desk">
    <rect x="0" y="198" width="240" height="32" fill="#22464F"/>
    <rect x="0" y="198" width="240" height="3" fill="#2F5A64"/>
