      <path d="M120 35 L120 62" stroke-width="6"/>
      <path d="M129 37 Q127 50 125 60" stroke-width="6"/>
      <path d="M55 92 Q63 94 71 97" stroke-width="4.5"/>
      <path d="M57 104 Q64 106 70 108" stroke-width="4.5"/>
      <path d="M185 92 Q177 94 169 97" stroke-width="4.5"/>
