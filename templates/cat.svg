      <path d="M182 80 L174 20 L134 46 Z" fill="#9A9289"/>
      <path d="M172 66 L168 34 L144 49 Z" fill="#E9897F" stroke="none"/>
      <path d="M170 62 Q164 54 166 46 M164 64 Q158 56 158 50" fill="none" stroke="#F4ECDD" stroke-width="2.5" stroke-linecap="round"/>
