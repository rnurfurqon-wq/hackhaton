      <path d="M66 198 L50 184 L28 130 L48 122 L74 172 Z" fill="#2D3E66"/>
      <ellipse cx="37" cy="117" rx="15" ry="14" fill="#F1E8D6"/>
      <g fill="#E9897F" stroke="none">
        <ellipse cx="37" cy="121" rx="6" ry="4.5"/>
        <circle cx="30" cy="113" r="2.4"/><circle cx="37" cy="110" r="2.4"/><circle cx="44" cy="113" r="2.4"/>
      </g>
    </g>
    <g class="arm-up-r">
      <path d="M174 198 L190 184 L212 130 L192 122 L166 172 Z" fill="#2D3E66"/>
      <ellipse cx="203" cy="117" rx="15" ry="14" fill="#F1E8D6"/>
      <g fill="#E9897F" stroke="none">
        <ellipse cx="203" cy="121" rx="6" ry="4.5"/>
        <circle cx="196" cy="113" r="2.4"/><circle cx="203" cy="110" r="2.4"/><circle cx="210" cy="113" r="2.4"/>
      </g>
    </g>
  </g>

  <!-- Efek -->
  <g class="sparkles" stroke-linecap="round">
    <g stroke="#F2B01E" stroke-width="4">
      <path d="M98 10 L101 20"/><path d="M142 10 L139 20"/>
      <path d="M58 28 L65 36"/><path d="M182 28 L175 36"/>
