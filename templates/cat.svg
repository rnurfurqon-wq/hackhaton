  <!-- Tangan di meja (bawaan) -->
  <g class="paws" fill="#F1E8D6" stroke="#2A2226" stroke-width="3">
    <ellipse class="paw-l" cx="90" cy="201" rx="16" ry="9.5"/>
    <ellipse class="paw-r" cx="150" cy="201" rx="16" ry="9.5"/>
  </g>

  <!-- Tangan di dagu (berpikir, skeptis) -->
  <g class="arm-chin" stroke="#2A2226" stroke-width="3" stroke-linejoin="round">
    <path d="M176 206 C176 184 160 166 140 157 L128 170 C144 178 154 190 152 206 Z" fill="#2D3E66"/>
    <path d="M141 156 L130 169" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="127" cy="153" rx="13" ry="11" fill="#F1E8D6"/>
    <path d="M118 151 Q124 146 131 149 M120 157 Q126 153 133 155" fill="none" stroke-width="2" stroke-linecap="round"/>
