    <g class="eyes-open">
      <circle cx="96" cy="94" r="16" fill="#FFFFFF" stroke="#2A2226" stroke-width="3"/>
      <circle cx="144" cy="94" r="16" fill="#FFFFFF" stroke="#2A2226" stroke-width="3"/>
      <g class="pupils">
        <circle cx="97" cy="95" r="11" fill="#2A2226"/>
        <circle cx="145" cy="95" r="11" fill="#2A2226"/>
        <circle cx="101.5" cy="90" r="4.5" fill="#FFFFFF"/>
        <circle cx="149.5" cy="90" r="4.5" fill="#FFFFFF"/>
        <circle cx="93" cy="99.5" r="2" fill="#FFFFFF"/>
        <circle cx="141" cy="99.5" r="2" fill="#FFFFFF"/>
